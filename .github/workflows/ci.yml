name: Verify exchange foundation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record actual runtime and SQLite build before tests
        run: |
          python - <<'PY'
          from contextlib import closing
          import json, os, pathlib, platform, sqlite3, subprocess, sys
          with closing(sqlite3.connect(':memory:')) as connection:
              options = [row[0] for row in connection.execute('PRAGMA compile_options')]
          cpu = pathlib.Path('/sys/fs/cgroup/cpu.max')
          print(json.dumps({'checkout_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
                            'python': sys.version, 'sqlite': sqlite3.sqlite_version,
                            'sqlite_compile_options': options, 'platform': platform.platform(),
                            'cpu_count': os.cpu_count(),
                            'cpu_affinity': sorted(os.sched_getaffinity(0)) if hasattr(os, 'sched_getaffinity') else None,
                            'cgroup_cpu_max': cpu.read_text().strip() if cpu.exists() else None}, indent=2))
          PY
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q uta formal tests
      - name: Run demo
        run: python -m uta demo
      - name: Preserve and replay research scenario
        run: python -m uta scenario --shards 4
      - name: Run transactional acceptance scenario
        run: python -m uta acceptance
      - name: Explore bounded reservation model
        run: python formal/explore_reservation.py
      - name: Explore bounded paired settlement model
        run: python formal/explore_settlement.py
      - name: Explore bounded grouped receipt protocol
        run: python formal/explore_group_commit.py
      - name: Explore bounded shard scheduling and commit retry models
        run: python formal/explore_shard_admission.py
      - name: Explore durable command receipt and recovery protocol
        run: python formal/explore_durable_commands.py
      - name: Explore bounded managed writer and liquidation receipt models
        run: python formal/explore_managed_authority.py
      - name: Build installable wheel
        run: |
          python -m pip install --disable-pip-version-check 'setuptools>=68' wheel
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
      - name: Verify installed package outside source tree
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/uta-smoke"
          "$RUNNER_TEMP/uta-smoke/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/uta-smoke/bin/python" -m uta demo
          "$RUNNER_TEMP/uta-smoke/bin/python" -m uta acceptance
          "$RUNNER_TEMP/uta-smoke/bin/python" -m uta scenario --shards 4
          "$RUNNER_TEMP/uta-smoke/bin/uta" --help
          "$RUNNER_TEMP/uta-smoke/bin/uta-ops" --help
          "$RUNNER_TEMP/uta-smoke/bin/uta-durable" --help
          "$RUNNER_TEMP/uta-smoke/bin/uta-durable" init --directory "$RUNNER_TEMP/uta-managed-installed" --shards 2 --asset-scale USD=8
          "$RUNNER_TEMP/uta-smoke/bin/uta-durable" inspect --directory "$RUNNER_TEMP/uta-managed-installed"
          "$RUNNER_TEMP/uta-smoke/bin/uta-durable" status --directory "$RUNNER_TEMP/uta-managed-installed"
      - name: Retain installable review artifact
        uses: actions/upload-artifact@v4
        with:
          name: uta-wheel-python-${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14
